---
# The whole monitoring integration: one include of the monitor_app role.
#   - monitor_app_targets    where Alloy should scrape (host:port on this machine)
#   - monitor_app_dashboards Grafana dashboards to install (optional)
# Safe to run when monitoring is not installed: it says so and does nothing.

# Resolve the path NOW, while role_path still means this role. Variables passed
# to include_role are evaluated later, inside monitor_app, where role_path
# would point at monitor_app instead.
- name: Work out where the dashboard file is
  ansible.builtin.set_fact:
    demo_metrics_dashboard: "{{ role_path }}/files/demo-metrics-dashboard.json"

- name: Monitor demo-metrics
  ansible.builtin.include_role:
    name: monitor_app
  vars:
    monitor_app_name: demo-metrics
    monitor_app_targets: ["127.0.0.1:{{ demo_metrics_port }}"]
    monitor_app_dashboards: ["{{ demo_metrics_dashboard }}"]
