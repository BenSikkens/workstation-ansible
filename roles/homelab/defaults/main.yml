---
# Settings the `homelab` command prints or needs to reach the right user. What
# is INSTALLED is not configured here; the command detects that at run time.
# Each value falls back to the default of the role it describes.
homelab_forgejo_user: "{{ forgejo_user | default('git') }}"
homelab_forgejo_http_port: "{{ forgejo_http_port | default(3000) }}"
homelab_monitoring_user: "{{ monitoring_user | default('monitoring') }}"
homelab_grafana_port: "{{ monitoring_grafana_port | default(3001) }}"
homelab_k3s_kubeconfig: "{{ k3s_kubeconfig_path | default('/home/' ~ desktop_user ~ '/.kube/k3s.yaml') }}"
