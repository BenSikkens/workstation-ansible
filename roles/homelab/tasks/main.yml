---
# Installs the `homelab` shell command (homelab up|down|status [scope]) for
# {{ desktop_user }} - the human at the keyboard, not the service accounts that run
# the containers - as a drop-in in ~/.bashrc.d/ (the loader is set up by the
# bashrc_loader role this one depends on).
#
# The command works out what is installed EACH TIME IT RUNS, by asking systemd
# which units exist. Nothing about what the playbook installed is baked in, so
# it stays correct when you install or remove something by hand, or run
# `ansible-playbook site.yml --tags k3s` without touching this role. Only
# settings (service user names, ports for the printed URLs) are rendered here.
#
# The command only shows up in NEW shells; in an open terminal run
#   source ~/.bashrc.d/homelab.sh

# No `backup: true`: every file in ~/.bashrc.d is sourced, so a backup copy
# would be loaded too and its old function would override the new one.
- name: Install the homelab command
  ansible.builtin.template:
    src: homelab.sh.j2
    dest: "/home/{{ desktop_user }}/.bashrc.d/homelab.sh"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0644"
