---
# Installs the `homelab` shell command (homelab up|down|status [scope]) for
# {{ desktop_user }} - the human at the keyboard, not the service accounts that run
# the containers - as a drop-in in ~/.bashrc.d/ (the loader is set up by the
# bashrc_loader role this one depends on).
#
# The command works out what is installed EACH TIME IT RUNS, by asking systemd
# which units exist. Nothing about what the playbook installed is baked in, so
# it stays correct when you install or remove something by hand, or run
# `ansible-playbook site.yml --tags k3s` without touching this role. Only
# settings (service user names, ports for the printed URLs) are rendered here.
#
# The command only shows up in NEW shells; in an open terminal run
#   source ~/.bashrc.d/homelab.sh

# No `backup: true`: every file in ~/.bashrc.d is sourced, so a backup copy
# would be loaded too and its old function would override the new one.
- name: Install the homelab command
  ansible.builtin.template:
    src: homelab.sh.j2
    dest: "/home/{{ desktop_user }}/.bashrc.d/homelab.sh"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0644"

# ------------------------------------------- homelab add monitoring|documentation
# homelab-monitoring: user part stages a project's dashboards into a drop folder
# (group-writable); root part, the only thing sudo allows, applies it to Grafana.
# homelab-obsidian: registers a docs folder as an Obsidian vault (as you).
- name: Install PyYAML (the tools read data source files with it)
  ansible.builtin.dnf:
    name: python3-pyyaml
    state: present

- name: Create the directory for the homelab tools
  ansible.builtin.file:
    path: "{{ homelab_libexec_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the homelab tools
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ homelab_libexec_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - homelab-monitoring
    - homelab-obsidian

- name: Create /etc/homelab
  ansible.builtin.file:
    path: /etc/homelab
    state: directory
    owner: root
    group: root
    mode: "0755"

# Read by the root part of homelab-monitoring; root-owned, so trusted.
- name: Write the settings of homelab-monitoring
  ansible.builtin.copy:
    content: "{{ {'monitoring_user': homelab_monitoring_user, 'config_dir': homelab_monitoring_config_dir, 'dropbox': homelab_dropbox_dir} | to_nice_json }}\n"
    dest: /etc/homelab/monitoring.json
    owner: root
    group: root
    mode: "0644"

# ------------------------------------------------- group and passwordless sudo
# Members of {{ homelab_group }} may run the exact commands `homelab` needs without a
# password (see templates/homelab.sudoers.j2). Everything else still asks.
- name: Create the group that may use homelab
  ansible.builtin.group:
    name: "{{ homelab_group }}"
    state: present

- name: Create the drop folder for `homelab add monitoring`
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ homelab_dropbox_dir | dirname }}", group: root, mode: "0755"}
    - {path: "{{ homelab_dropbox_dir }}", group: "{{ homelab_group }}", mode: "2775"}

- name: Add the homelab users to that group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ homelab_group }}"
    append: true
  loop: "{{ homelab_users }}"

# The rules pin the uid in /run/user/<uid>, so a service user that does not exist
# yet gets no rules. Run this role again after installing Forgejo or monitoring.
- name: Look up the service accounts that exist
  ansible.builtin.getent:
    database: passwd
    key: "{{ item.user }}"
    fail_key: false
  loop: "{{ homelab_user_units }}"
  loop_control:
    label: "{{ item.user }}"
  register: homelab_getent

- name: Work out the accounts the sudoers file covers
  ansible.builtin.set_fact:
    homelab_sudo_accounts: >-
      {{ homelab_sudo_accounts | default([]) + [item.item | combine({'uid': item.ansible_facts.getent_passwd[item.item.user][1]})] }}
  loop: "{{ homelab_getent.results }}"
  loop_control:
    label: "{{ item.item.user }}"
  when: item.ansible_facts.getent_passwd[item.item.user] is not none

- name: Make sure the sudoers template always has a list to loop over
  ansible.builtin.set_fact:
    homelab_sudo_accounts: "{{ homelab_sudo_accounts | default([]) }}"

# The rules let group members run these files as root, so they must not be
# writable by anyone else.
- name: Check the k3s files the sudoers rules point at
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ homelab_k3s_bin }}"
    - "{{ homelab_k3s_killall }}"
  register: homelab_k3s_files

- name: Refuse to allow k3s files that others can modify
  ansible.builtin.assert:
    that:
      - item.stat.pw_name == 'root'
      - not item.stat.wgrp
      - not item.stat.woth
    fail_msg: "{{ item.item }} must be owned by root and not writable by group or others, or the sudo rule for it would be a hole."
    quiet: true
  loop: "{{ homelab_k3s_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Install the sudoers rules for homelab
  ansible.builtin.template:
    src: homelab.sudoers.j2
    dest: /etc/sudoers.d/homelab
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
