---
# Ensures one secret exists as a file (0600, never overwritten) and as a Podman
# secret of the identity user. Called with:
#   identity_secret_name   file and Podman secret name
#   identity_secret_cmd    command that prints the value (default: 32 random bytes as hex)
- name: Generate {{ identity_secret_name }} (kept on disk, 0600, never overwritten)
  ansible.builtin.shell: "umask 077 && {{ identity_secret_cmd | default('openssl rand -hex 32') }} > {{ identity_secrets_dir }}/{{ identity_secret_name }}"
  args:
    creates: "{{ identity_secrets_dir }}/{{ identity_secret_name }}"
  become: true
  become_user: "{{ identity_user }}"

- name: Check whether {{ identity_secret_name }} is already a Podman secret
  ansible.builtin.command: "podman secret exists {{ identity_secret_name }}"
  args:
    chdir: "/home/{{ identity_user }}"
  become: true
  become_user: "{{ identity_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ identity_uid }}"
  register: identity_secret_exists
  changed_when: false
  failed_when: identity_secret_exists.rc not in [0, 1]

- name: Store {{ identity_secret_name }} as a Podman secret
  ansible.builtin.command: "podman secret create {{ identity_secret_name }} {{ identity_secrets_dir }}/{{ identity_secret_name }}"
  args:
    chdir: "/home/{{ identity_user }}"
  become: true
  become_user: "{{ identity_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ identity_uid }}"
  changed_when: true
  no_log: true
  when: identity_secret_exists.rc != 0
