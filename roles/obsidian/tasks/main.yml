---
# Obsidian has no official RPM for Fedora; installed via Flathub, same
# pattern as podman_desktop. (Previously this role ran Obsidian in a
# rootless container via a web-desktop image — replaced with a native
# Flatpak install per request.)

- name: Install Obsidian (flatpak)
  community.general.flatpak:
    name: md.obsidian.Obsidian
    state: present
    method: system
