---
# The pieces that sit next to the stack and feed it:
#   1. Pushgateway - a container under the Forgejo service user, on the Forgejo
#      network, so CI job containers can reach it by name (only if Forgejo is
#      installed).
#   2. prometheus-podman-exporter - one systemd *user* service per Podman user
#      to graph (service user + desktop user).
#   3. Grafana Alloy - one host-wide agent (system service) that ships host
#      metrics, the exporters' metrics, the Pushgateway's scan results and the
#      journal (incl. container logs) into Prometheus and Loki.

# The Pushgateway only makes sense next to Forgejo (CI jobs push scan results
# to it over Forgejo's network), so it is deployed only when Forgejo is
# installed. Installing Forgejo later? Re-run this role to add it:
#   ansible-playbook site.yml --tags monitoring
- name: Look for an installed Forgejo (the Pushgateway joins its network)
  ansible.builtin.stat:
    path: "/home/{{ monitoring_forgejo_user }}/.config/containers/systemd/forgejo.container"
  register: monitoring_forgejo_quadlet

- name: Decide whether the Pushgateway is deployed
  ansible.builtin.set_fact:
    monitoring_pushgateway_enabled: "{{ monitoring_forgejo_quadlet.stat.exists }}"

- name: Explain why there is no Pushgateway
  ansible.builtin.debug:
    msg: >-
      Forgejo is not installed for {{ monitoring_forgejo_user }}, so the Pushgateway (CI scan
      results) is skipped. Install Forgejo, then re-run with --tags monitoring.
  when: not monitoring_pushgateway_enabled

- name: Deploy the Pushgateway next to Forgejo
  when: monitoring_pushgateway_enabled
  block:
    - name: Look up the Forgejo service user's uid
      ansible.builtin.command: "id -u {{ monitoring_forgejo_user }}"
      register: monitoring_forgejo_uid
      changed_when: false

    - name: Deploy the Pushgateway Quadlet unit
      ansible.builtin.template:
        src: pushgateway.container.j2
        dest: "/home/{{ monitoring_forgejo_user }}/.config/containers/systemd/pushgateway.container"
        owner: "{{ monitoring_forgejo_user }}"
        group: "{{ monitoring_forgejo_user }}"
        mode: "0644"
        backup: true
      register: monitoring_pushgateway_quadlet

    - name: Reload the Forgejo user's systemd units (picks up the Pushgateway)  # noqa: no-handler
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      become: true
      become_user: "{{ monitoring_forgejo_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ monitoring_forgejo_uid.stdout }}"
      when: monitoring_pushgateway_quadlet.changed

    - name: Start the Pushgateway
      ansible.builtin.systemd:
        name: pushgateway.service
        scope: user
        state: "{{ 'restarted' if monitoring_pushgateway_quadlet.changed else 'started' }}"
        enabled: true
      become: true
      become_user: "{{ monitoring_forgejo_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ monitoring_forgejo_uid.stdout }}"

# ----------------------------------------------------------- Podman exporters

- name: Install the Podman exporter
  ansible.builtin.dnf:
    name: prometheus-podman-exporter
    state: present
  when: ansible_facts['os_family'] == "RedHat"

# Only users that exist get an exporter (the Forgejo user is absent when Forgejo
# is not installed).
- name: Look up the uids of the users whose Podman is monitored
  ansible.builtin.command: "id -u {{ item.user }}"
  loop: "{{ monitoring_podman_exporters + monitoring_podman_exporters_extra }}"
  loop_control:
    label: "{{ item.user }}"
  register: monitoring_exporter_uids
  changed_when: false
  failed_when: false

- name: Keep the users that exist
  ansible.builtin.set_fact:
    monitoring_exporters_active: "{{ monitoring_exporter_uids.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
    monitoring_exporters_uid_list: "{{ monitoring_exporter_uids.results | selectattr('rc', 'equalto', 0) | map(attribute='stdout') | list }}"

# monitoring_exporters_uid_list and monitoring_exporters_active line up by index (idx).
- name: Create the systemd user directory for each exporter user
  ansible.builtin.file:
    path: "/home/{{ item.user }}/.config/systemd/user"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0755"
  loop: "{{ monitoring_exporters_active }}"
  loop_control:
    label: "{{ item.user }}"

- name: Deploy the Podman exporter user service
  ansible.builtin.template:
    src: prometheus-podman-exporter.service.j2
    dest: "/home/{{ item.user }}/.config/systemd/user/prometheus-podman-exporter.service"
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0644"
    backup: true
  loop: "{{ monitoring_exporters_active }}"
  loop_control:
    label: "{{ item.user }}"
  register: monitoring_exporter_units

- name: Reload each exporter user's systemd units
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ item.user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ monitoring_exporters_uid_list[idx] }}"
  loop: "{{ monitoring_exporters_active }}"
  loop_control:
    index_var: idx
    label: "{{ item.user }}"

- name: Start the Podman exporters
  ansible.builtin.systemd:
    name: prometheus-podman-exporter.service
    scope: user
    state: "{{ 'restarted' if monitoring_exporter_units.results[idx].changed else 'started' }}"
    enabled: true
  become: true
  become_user: "{{ item.user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ monitoring_exporters_uid_list[idx] }}"
  loop: "{{ monitoring_exporters_active }}"
  loop_control:
    index_var: idx
    label: "{{ item.user }}"

# ---------------------------------------------------------------------- Alloy

- name: Trust Grafana's package signing key
  ansible.builtin.rpm_key:
    key: "{{ monitoring_alloy_repo_gpgkey }}"
    state: present

- name: Add Grafana's package repository
  ansible.builtin.yum_repository:
    name: grafana
    description: grafana
    baseurl: "{{ monitoring_alloy_repo_baseurl }}"
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: "{{ monitoring_alloy_repo_gpgkey }}"
    sslverify: true
    enabled: true

- name: Install Grafana Alloy
  ansible.builtin.dnf:
    name: alloy
    state: present

# Without these groups the journal source starts fine but reads nothing.
- name: Let the alloy user read the systemd journal
  ansible.builtin.user:
    name: alloy
    groups:
      - adm
      - systemd-journal
    append: true
  register: monitoring_alloy_groups

# Applications register scrape targets here (see the monitor_app role). Alloy
# re-reads the directory every 30 seconds, so no restart is needed.
- name: Create the directory applications drop scrape targets into
  ansible.builtin.file:
    path: /etc/alloy/targets.d
    state: directory
    owner: root
    group: alloy
    mode: "0755"

- name: Render the Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: "0640"
    backup: true
  register: monitoring_alloy_config

- name: Start Alloy
  ansible.builtin.systemd:
    name: alloy.service
    state: "{{ 'restarted' if monitoring_alloy_groups.changed else ('reloaded' if monitoring_alloy_config.changed else 'started') }}"
    enabled: true
